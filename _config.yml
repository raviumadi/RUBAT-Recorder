title: RUBAT Studio
description: A unified acquisition platform for high-sample-rate multichannel bioacoustics.
remote_theme: pages-themes/cayman@v0.2.0

# Find the theme documentation here --> https://github.com/pages-themes/cayman

url: "https://biosonix.io"
baseurl: ""   # IMPORTANT: must match your repo name exactly
permalink: pretty

# Appearance
color_scheme: light

# Color customization (site-wide). Change these to restyle the site.
colors:
  primary: "#0366d6"     # main link / accent color
  accent: "#159957"      # secondary/accent
  header_start: "#155799" # hero/header gradient start
  header_end: "#159957"   # hero/header gradient end
  background: "#ffffff"   # page background
  text: "#24292e"         # main text color
  muted: "#e1e4e8"        # borders, muted elements
  nav_bg: "#f7f9fb"       # navigation background
  button_bg: "#0366d6"    # default button background
  button_text: "#ffffff"  # default button text

# Options # <-- Enable and update

# show_downloads: true # ["true" or "false" (unquoted) to indicate whether to provide a download URL]
# google_analytics: [Your Google Analytics tracking ID]

# github:
#   zip_url: http://example.com/download.zip
#   another_url: another value

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 8
  preview_words_after: 12
  tokenizer_separator: /[\s/]+/
  rel_url: true

# # Aux links (top-right)
# aux_links:
#   "GitHub Repository":
#     - "https://github.com/raviumadi/RUBAT-Recorder" # Update this

# Footer/back-to-top
back_to_top: true
back_to_top_text: "Back to top"

# Edit link (optional)
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/raviumadi/RUBAT-Recorder" # Update this
gh_edit_branch: "main"
gh_edit_source: "docs"
gh_edit_view_mode: "tree"

# Keep it simple, only necessary plugins
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one